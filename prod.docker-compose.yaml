# ──────────────────────────────────────────────────────────────────────────────
# prod.docker-compose.yaml  •  PRODUCTION
# ──────────────────────────────────────────────────────────────────────────────
name: canton-bot-prod

services:
  # --- MONGO DB (Local) ---
  mongodb:
    image: mongo:6.0
    container_name: canton_mongodb_prod
    # No exposed ports in production for extra security (container-only access)
    volumes:
      - mongodb_data_prod:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    networks:
      - canton_bot_network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_ROOT_USER}", "--password", "${MONGO_ROOT_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # --- NEXT.JS DASHBOARD ---
  canton_bot:
    container_name: canton_bot_prod
    build:
      context: .
      dockerfile: prod.Dockerfile
      args:
        NEXT_PUBLIC_ENV: production
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CENTRAL_FRONTEND_REDIRECT_URL: ${NEXT_PUBLIC_CENTRAL_FRONTEND_REDIRECT_URL}
        NEXT_PUBLIC_USER_REDIRECT_BASE_URL: ${NEXT_PUBLIC_USER_REDIRECT_BASE_URL}
        NEXT_PUBLIC_CENTRAL_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CENTRAL_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - DYDX_NETWORK=${DYDX_NETWORK}
      - DYDX_MNEMONIC=${DYDX_MNEMONIC}
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/canton-bot?authSource=admin
      - COINGLASS_API_KEY=${COINGLASS_API_KEY}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    networks:
      - canton_bot_network

  # --- DOZZLE LOG VIEWER ---
  dozzle:
    container_name: dozzle_prod
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    networks:
      - canton_bot_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  mongodb_data_prod:

networks:
  canton_bot_network:
    external: false